<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeriFact Check options</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1c2033; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font: inherit; }
    button { margin-top: 20px; padding: 8px 16px; font: inherit; }
    .hint { color: #555b73; font-size: 13px; }
    #status { margin-top: 12px; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>VeriFact Check</h1>
  <p class="hint">Right-click anywhere on a page, choose "Check this area with VeriFact", then drag over the part of the page to check. Only the cropped picture is sent. No account, page address or identifier is.</p>
  <form id="form">
    <label for="check">Check service address</label>
    <input id="check" type="url" placeholder="https://" autocomplete="off" required>
    <label for="web">Web app address (for "See the whole story")</label>
    <input id="web" type="url" placeholder="https://" autocomplete="off">
    <button type="submit">Save</button>
  </form>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
