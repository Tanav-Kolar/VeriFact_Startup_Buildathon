name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt -r services/check/requirements.txt pytest ruff

      - name: Ruff lint
        run: ruff check verifact_core services/api services/check tests

      - name: Pytest suite (offline, mocked)
        run: PYTHONPATH=. pytest -q

  web:
    name: Web tests, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Run web tests
        run: npm --prefix web test

      - name: Typecheck web
        run: npm --prefix web run typecheck

      - name: Build web bundle
        run: npm --prefix web run build
